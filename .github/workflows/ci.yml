name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & run tests
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify jacoco:report

      - name: Upload Jacoco report as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: OWASP Dependency-Check
        run: |
          ./mvnw -B org.owasp:dependency-check-maven:check -Dformat=HTML -DoutputDirectory=dependency-check-report
        continue-on-error: true
        timeout-minutes: 15

      - name: Scan repository for secrets
        uses: trufflesecurity/trufflehog@v3.99.7
        with:
          path: .
          extra_args: --only-verified

      - name: Build Docker image
        run: docker build -t deployfast-taskmanagement:latest .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: deployfast-taskmanagement:latest

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag deployfast-taskmanagement:latest ${{ secrets.DOCKERHUB_USERNAME }}/deployfast-taskmanagement:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/deployfast-taskmanagement:latest
