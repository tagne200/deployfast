spring:
  application:
    name: deployfast-task-management-api-test
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  datasource:
    url: jdbc:h2:mem:test_db;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

server:
  servlet:
    context-path: /api/v1
  port: 8081

# Configuration JWT pour les tests
app:
  jwt:
    secret: TestSecretKeyForJwtTokenProviderMustBeLongEnoughForHS512AlgorithmTesting
    expiration: 86400000
    refresh-expiration: 604800000

logging:
  level:
    root: WARN
    com.deployfast: INFO
    org.springframework.security: WARN
