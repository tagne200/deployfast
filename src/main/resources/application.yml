spring:
  application:
    name: deployfast-task-management-api
  
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

server:
  servlet:
    context-path: /api/v1
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Configuration JWT
app:
  jwt:
    secret: ${JWT_SECRET:MySecretKeyForDeployFastTaskManagementApplicationMustBeLongEnough}
    expiration: ${JWT_EXPIRATION:86400000}  # 24 heures
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 jours

# Logging
logging:
  level:
    root: INFO
    com.deployfast: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
